<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel – NightWither</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #0a0a0d;
    --surface: #111116;
    --card: #16161b;
    --border: rgba(255,255,255,0.07);
    --gold: #c9a84c;
    --text: #e8e8e8;
    --muted: #888;
  }

  body {
    background: #000000;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .login-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    max-width: 380px;
    width: 100%;
  }

  .login-title {
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 30px;
    text-align: center;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-label {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .form-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    transition: border-color 0.2s;
  }

  .form-input:focus {
    outline: none;
    border-color: var(--gold);
  }

  .login-btn {
    width: 100%;
    padding: 12px;
    background: var(--gold);
    color: #000;
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 20px;
  }

  .login-btn:hover {
    opacity: 0.8;
  }

  .login-error {
    color: #f87171;
    font-size: 0.8rem;
    margin-top: 10px;
    text-align: center;
  }

  .admin-panel {
    display: none;
  }

  header {
    background: rgba(10,10,13,0.92);
    border-bottom: 1px solid var(--border);
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header-title {
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .logout-btn {
    padding: 8px 16px;
    background: rgba(220,38,38,0.2);
    color: #f87171;
    border: 1px solid rgba(220,38,38,0.5);
    border-radius: 6px;
    font-size: 0.75rem;
    cursor: pointer;
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 16px;
  }

  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
  }

  .tab {
    padding: 8px 16px;
    background: none;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.9rem;
    text-transform: uppercase;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .tab.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }

  .form-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .form-section h3 {
    font-size: 1rem;
    margin-bottom: 20px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }

  .submit-btn {
    padding: 12px 24px;
    background: var(--gold);
    color: #000;
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  .status-message {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 0.85rem;
  }

  .status-message.success {
    background: rgba(34,197,94,0.15);
    color: #4ade80;
  }

  .status-message.error {
    background: rgba(220,38,38,0.15);
    color: #f87171;
  }

  .items-list {
    background: var(--surface);
    border-radius: 8px;
  }

  .item {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .item:last-child {
    border-bottom: none;
  }

  .item-info h4 {
    font-size: 0.95rem;
    margin-bottom: 4px;
  }

  .item-info p {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .delete-btn {
    padding: 6px 12px;
    background: rgba(220,38,38,0.2);
    color: #f87171;
    border: none;
    border-radius: 6px;
    font-size: 0.7rem;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-title">Admin Panel</div>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Master Passwort</label>
        <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required />
      </div>
      <button type="submit" class="login-btn">Login →</button>
      <div id="loginError" class="login-error"></div>
    </form>
  </div>
</div>

<div id="adminPanel" class="admin-panel">
  <header>
    <div class="header-title">🔧 Admin Panel</div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <main>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('events')">Events</button>
      <button class="tab" onclick="switchTab('streaming')">Streaming Plan</button>
      <button class="tab" onclick="switchTab('livestatus')">Live Status</button>
    </div>

    <div id="events" class="tab-content active">
      <div class="form-section">
        <h3>Neues Event</h3>
        <div class="form-grid">
          <input type="text" id="eventTitle" class="form-input" placeholder="Event Titel" />
          <select id="eventType" class="form-input">
            <option value="tournament">Tournament</option>
            <option value="verlosung">Verlosung</option>
            <option value="community">Community</option>
            <option value="stream">Stream</option>
            <option value="challenge">Challenge</option>
            <option value="sonstiges">Sonstiges</option>
          </select>
          <input type="datetime-local" id="eventDate" class="form-input" />
          <input type="text" id="eventPrize" class="form-input" placeholder="Prize Pool" />
        </div>
        <textarea id="eventDesc" class="form-input" placeholder="Beschreibung" style="grid-column: 1/-1; min-height: 80px;"></textarea>
        <button class="submit-btn" onclick="addNewEvent()">Event erstellen →</button>
        <div id="eventStatus" class="status-message" style="display:none;"></div>
      </div>

      <div>
        <h3 style="margin-bottom: 16px;">Aktuelle Events</h3>
        <div id="eventsList" class="items-list"></div>
      </div>
    </div>

    <div id="streaming" class="tab-content">
      <div class="form-section">
        <h3>Streaming hinzufügen</h3>
        <div class="form-grid">
          <select id="streamDay" class="form-input">
            <option value="Montag">Montag</option>
            <option value="Dienstag">Dienstag</option>
            <option value="Mittwoch">Mittwoch</option>
            <option value="Donnerstag">Donnerstag</option>
            <option value="Freitag">Freitag</option>
            <option value="Samstag">Samstag</option>
            <option value="Sonntag">Sonntag</option>
          </select>
          <input type="time" id="streamTime" class="form-input" />
          <input type="text" id="streamGame" class="form-input" placeholder="Spiel" />
          <input type="text" id="streamPlatform" class="form-input" placeholder="Plattform" />
        </div>
        <button class="submit-btn" onclick="addNewStream()">Stream hinzufügen →</button>
        <div id="streamStatus" class="status-message" style="display:none;"></div>
      </div>

      <div>
        <h3 style="margin-bottom: 16px;">Streaming Plan</h3>
        <div id="streamList" class="items-list"></div>
      </div>
    </div>

    <div id="livestatus" class="tab-content">
      <div class="form-section">
        <h3>Twitch Live Status</h3>
        <p style="margin-bottom: 16px; color: var(--muted);">Wird automatisch von Streamer.bot aktualisiert</p>
        <div style="display: flex; gap: 10px;">
          <button class="submit-btn" onclick="setLiveStatus(true)" style="background: rgba(34,197,94,0.8);">🔴 LIVE</button>
          <button class="submit-btn" onclick="setLiveStatus(false)" style="background: rgba(107,114,128,0.8);">⚪ OFFLINE</button>
        </div>
        <div id="liveStatus" class="status-message" style="display:none; margin-top: 16px;"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCGZTtokmCpu9CTDRWOi5HHO4CGO-BZgGU",
  authDomain: "adminpannel-f0aab.firebaseapp.com",
  projectId: "adminpannel-f0aab",
  storageBucket: "adminpannel-f0aab.firebasestorage.app",
  messagingSenderId: "373454919812",
  appId: "1:373454919812:web:281bd757fb982bb24f4ad1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const MASTER_PASSWORD = "MrN@w1th_Gh0$t_2k25!";
let isLoggedIn = false;

document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const password = document.getElementById('loginPassword').value;
  
  if (password === MASTER_PASSWORD) {
    isLoggedIn = true;
    sessionStorage.setItem('adminLoggedIn', 'true');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadEvents();
    loadStreams();
  } else {
    document.getElementById('loginError').textContent = 'Passwort falsch!';
  }
});

if (sessionStorage.getItem('adminLoggedIn') === 'true') {
  isLoggedIn = true;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  loadEvents();
  loadStreams();
}

function logout() {
  isLoggedIn = false;
  sessionStorage.removeItem('adminLoggedIn');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('loginForm').reset();
}

async function addNewEvent() {
  if (!isLoggedIn) return;
  
  try {
    await db.collection('events').add({
      title: document.getElementById('eventTitle').value,
      type: document.getElementById('eventType').value,
      eventDate: new Date(document.getElementById('eventDate').value).toISOString(),
      prizePool: document.getElementById('eventPrize').value,
      description: document.getElementById('eventDesc').value,
      createdAt: new Date()
    });
    
    showStatus('eventStatus', '✓ Event erstellt!', 'success');
    document.getElementById('eventTitle').value = '';
    document.getElementById('eventPrize').value = '';
    document.getElementById('eventDesc').value = '';
    loadEvents();
  } catch (error) {
    showStatus('eventStatus', '✗ Fehler: ' + error.message, 'error');
  }
}

async function loadEvents() {
  try {
    const snap = await db.collection('events').get();
    const html = snap.docs.map(doc => `
      <div class="item">
        <div class="item-info">
          <h4>${doc.data().title}</h4>
          <p>${doc.data().type} • ${new Date(doc.data().eventDate).toLocaleDateString('de-DE')}</p>
        </div>
        <button class="delete-btn" onclick="deleteEvent('${doc.id}')">Löschen</button>
      </div>
    `).join('');
    document.getElementById('eventsList').innerHTML = html || '<p style="padding: 16px; color: var(--muted);">Keine Events</p>';
  } catch (error) {
    console.error(error);
  }
}

function deleteEvent(id) {
  if (confirm('Wirklich löschen?')) {
    db.collection('events').doc(id).delete().then(() => loadEvents());
  }
}

async function addNewStream() {
  if (!isLoggedIn) return;
  
  try {
    await db.collection('streamingplan').add({
      day: document.getElementById('streamDay').value,
      time: document.getElementById('streamTime').value,
      game: document.getElementById('streamGame').value,
      platform: document.getElementById('streamPlatform').value,
      createdAt: new Date()
    });
    
    showStatus('streamStatus', '✓ Stream hinzugefügt!', 'success');
    document.getElementById('streamGame').value = '';
    document.getElementById('streamPlatform').value = '';
    loadStreams();
  } catch (error) {
    showStatus('streamStatus', '✗ Fehler: ' + error.message, 'error');
  }
}

async function loadStreams() {
  try {
    const snap = await db.collection('streamingplan').get();
    const html = snap.docs.map(doc => `
      <div class="item">
        <div class="item-info">
          <h4>${doc.data().day} • ${doc.data().time}</h4>
          <p>${doc.data().game} • ${doc.data().platform}</p>
        </div>
        <button class="delete-btn" onclick="deleteStream('${doc.id}')">Löschen</button>
      </div>
    `).join('');
    document.getElementById('streamList').innerHTML = html || '<p style="padding: 16px; color: var(--muted);">Kein Streaming Plan</p>';
  } catch (error) {
    console.error(error);
  }
}

function deleteStream(id) {
  if (confirm('Wirklich löschen?')) {
    db.collection('streamingplan').doc(id).delete().then(() => loadStreams());
  }
}

async function setLiveStatus(isLive) {
  if (!isLoggedIn) return;
  
  try {
    await db.collection('status').doc('twitch').set({
      isLive: isLive,
      updatedAt: new Date(),
      updatedBy: 'admin'
    });
    showStatus('liveStatus', isLive ? '✓ 🔴 LIVE!' : '✓ ⚪ OFFLINE!', 'success');
  } catch (error) {
    showStatus('liveStatus', '✗ Fehler: ' + error.message, 'error');
  }
}

function showStatus(elementId, message, type) {
  const el = document.getElementById(elementId);
  el.textContent = message;
  el.className = `status-message ${type}`;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

function switchTab(tabName) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById(tabName).classList.add('active');
  event.target.classList.add('active');
}
</script>

</body>
</html>
